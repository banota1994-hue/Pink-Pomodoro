<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  background: transparent;
  font-family: 'Cairo', sans-serif;
}

.card {
  width: 620px;
  height: 680px; /* نفس النسبة بالصورة */
  border-radius: 26px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 20px 45px rgba(0,0,0,0.2);
  color: white;
}

/* الخلفية */
.card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: url("https://i.imgur.com/WG3oMtB.jpg") center/cover no-repeat;
  z-index: 0;
}

/* طبقة تركيز */
.card::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(224,138,179,0.35);
  z-index: 0;
  transition: background 0.4s ease;
}

/* وضع الاستراحة */
.card.break::after {
  background: rgba(120, 200, 170, 0.35);
}

.content {
  position: relative;
  z-index: 1;
  padding: 60px 30px;
  text-align: center;
}

.title {
  font-size: 22px;
  font-weight: 600;
}

.timer {
  font-size: 90px;
  font-weight: 600;
  margin: 30px 0;
  transition: color 0.4s ease;
}

.break .timer {
  color: #c8ffe6;
}

.controls {
  margin: 25px 0;
  display: flex;
  justify-content: center;
  gap: 18px;
}

.controls button {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  border: none;
  font-size: 22px;
  cursor: pointer;
  background: rgba(255,255,255,0.25);
  backdrop-filter: blur(6px);
  color: white;
  transition: all 0.2s ease;
}

.controls button:hover {
  transform: scale(1.08);
}

/* توهج */
.glow {
  box-shadow: 0 0 25px rgba(255,255,255,0.9),
              0 0 50px rgba(255,150,200,0.9);
}

.break .glow {
  box-shadow: 0 0 25px rgba(180,255,220,0.9),
              0 0 50px rgba(120,220,190,0.9);
}

.priorities {
  margin-top: 40px;
}

.priorities input {
  width: 75%;
  padding: 14px;
  border-radius: 16px;
  border: none;
  margin: 10px 0;
  font-family: 'Cairo', sans-serif;
  font-size: 16px;
}
</style>
</head>

<body>

<div class="card" id="card">
  <div class="content">
    <div class="title" id="modeText">وضع التركيز 🍅</div>
    <div class="timer" id="timer">25:00</div>

    <div>
      استراحة:
      <select id="breakSelect">
        <option value="5">5 دقائق</option>
        <option value="10">10 دقائق</option>
      </select>
    </div>

    <div class="controls">
      <button id="startBtn" onclick="startTimer()">▶</button>
      <button onclick="pauseTimer()">⏸</button>
      <button onclick="stopTimer()">⏹</button>
    </div>

    <div class="priorities">
      <input placeholder="الأولوية الأولى">
      <input placeholder="الأولوية الثانية">
      <input placeholder="الأولوية الثالثة">
    </div>
  </div>
</div>

<script>
let focusTime = 25 * 60;
let breakTime = 5 * 60;
let currentTime = focusTime;
let timerInterval = null;
let isBreak = false;

const beep = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");

function updateDisplay() {
  let minutes = Math.floor(currentTime / 60);
  let seconds = currentTime % 60;
  minutes = minutes < 10 ? "0" + minutes : minutes;
  seconds = seconds < 10 ? "0" + seconds : seconds;
  document.getElementById("timer").textContent = minutes + ":" + seconds;
}

function startTimer() {
  if (timerInterval) return;

  document.getElementById("startBtn").classList.add("glow");

  timerInterval = setInterval(() => {
    if (currentTime > 0) {
      currentTime--;
      updateDisplay();
    } else {
      beep.play();
      isBreak = !isBreak;
      breakTime = document.getElementById("breakSelect").value * 60;
      currentTime = isBreak ? breakTime : focusTime;

      document.getElementById("modeText").textContent =
        isBreak ? "وضع الاستراحة 🌿" : "وضع التركيز 🍅";

      document.getElementById("card").classList.toggle("break");

      updateDisplay();
    }
  }, 1000);
}

function pauseTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
  document.getElementById("startBtn").classList.remove("glow");
}

function stopTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
  isBreak = false;
  currentTime = focusTime;
  document.getElementById("modeText").textContent = "وضع التركيز 🍅";
  document.getElementById("card").classList.remove("break");
  document.getElementById("startBtn").classList.remove("glow");
  updateDisplay();
}

updateDisplay();
</script>

</body>
</html>

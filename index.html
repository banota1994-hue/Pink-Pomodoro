<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&display=swap" rel="stylesheet">
<style>
html,body{
margin:0;
padding:0;
height:100%;
display:flex;
justify-content:center;
align-items:center;
background:transparent;
font-family:'Cairo',sans-serif;
}
.card{
width:620px;
height:680px;
border-radius:26px;
overflow:hidden;
position:relative;
box-shadow:0 20px 45px rgba(0,0,0,0.2);
color:white;
}
.card::before{
content:"";
position:absolute;
inset:0;
background:url("https://i.imgur.com/WG3oMtB.jpg") center/cover no-repeat;
z-index:0;
}
.card::after{
content:"";
position:absolute;
inset:0;
background:rgba(224,138,179,0.35);
z-index:0;
transition:background .4s ease;
}
.card.break::after{
background:rgba(120,200,170,0.35);
}
.content{
position:relative;
z-index:1;
padding:60px 30px;
text-align:center;
}
.timer{
font-size:90px;
margin:30px 0;
}
.controls{
margin:25px 0;
display:flex;
justify-content:center;
gap:18px;
}
.controls button{
width:64px;
height:64px;
border-radius:50%;
border:none;
font-size:22px;
cursor:pointer;
background:rgba(255,255,255,0.25);
backdrop-filter:blur(6px);
color:white;
}
.glow{
box-shadow:0 0 25px rgba(255,255,255,.9),
0 0 50px rgba(255,150,200,.9);
}
select{
padding:8px 12px;
border-radius:12px;
border:none;
font-family:'Cairo',sans-serif;
margin-top:5px;
}
#statsOverlay{
position:fixed;
inset:0;
background:rgba(0,0,0,0.4);
display:none;
justify-content:center;
align-items:center;
z-index:999;
}
.statsBox{
width:420px;
max-height:80vh;
overflow:auto;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(15px);
border-radius:20px;
padding:30px;
color:white;
text-align:center;
box-shadow:0 20px 50px rgba(0,0,0,0.3);
}
input[type="number"]{
border-radius:6px;
border:none;
padding:4px;
width:60px;
}
</style>
</head>
<body>

<div class="card" id="card">
<div class="content">
<div id="modeText">وضع التركيز 🍅</div>
<div class="timer" id="timer">30:00</div>

<div>
<label>الأولوية:</label><br>
<select id="prioritySelect">
<option value="قراءة">قراءة</option>
<option value="كتابة">كتابة</option>
<option value="رسم">رسم</option>
<option value="أخرى">أخرى</option>
</select>
</div>

<div style="margin-top:15px;">
استراحة:
<select id="breakSelect">
<option value="5">5 دقائق</option>
<option value="10">10 دقائق</option>
</select>
</div>

<div class="controls">
<button id="startBtn">▶</button>
<button id="pauseBtn">⏸</button>
<button id="stopBtn">⏹</button>
<button onclick="openStats()">📊</button>
</div>
</div>
</div>

<div id="statsOverlay">
<div class="statsBox">
<div style="display:flex;justify-content:space-between;align-items:center;">
<div style="font-size:20px;">📊 الإحصائيات</div>
<button onclick="closeStats()" style="background:none;border:none;color:white;font-size:18px;cursor:pointer;">✕</button>
</div>
<div id="statsContent" style="margin-top:20px;line-height:1.8;"></div>
</div>
</div>

<script>
let focusTime = 30*60;
let breakTime = 5*60;
let currentTime = focusTime;
let timerInterval = null;
let isBreak = false;
let lockedPriority = null;

/* 🔔 الأصوات */
const focusSound = new Audio("https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg");
const breakSound = new Audio("https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg");
focusSound.volume = 0.6;
breakSound.volume = 0.4;

/* ===== Storage ===== */

function getCurrentYearMonth(){
const now = new Date();
return {
year: now.getFullYear().toString(),
month: (now.getMonth()+1).toString().padStart(2,"0")
};
}

function getData(){
return JSON.parse(localStorage.getItem("focusData")) || {};
}

function saveData(data){
localStorage.setItem("focusData", JSON.stringify(data));
}

function ensureMonthExists(){
let data = getData();
const {year, month} = getCurrentYearMonth();
if(!data[year]) data[year] = {};
if(!data[year][month]) data[year][month] = {};
saveData(data);
}

/* ===== Tracking ===== */

function addSecond(){
let data = getData();
const now = new Date();
const {year, month} = getCurrentYearMonth();
const dayKey = now.toISOString().slice(0,10);

if(!data[year][month][lockedPriority]){
data[year][month][lockedPriority] = {time:0,sessions:0,days:{}};
}
if(!data[year][month][lockedPriority].days[dayKey]){
data[year][month][lockedPriority].days[dayKey] = {time:0,sessions:0};
}

data[year][month][lockedPriority].time += 1;
data[year][month][lockedPriority].days[dayKey].time += 1;
saveData(data);
}

function addSession(){
let data = getData();
const now = new Date();
const {year, month} = getCurrentYearMonth();
const dayKey = now.toISOString().slice(0,10);

data[year][month][lockedPriority].sessions += 1;
data[year][month][lockedPriority].days[dayKey].sessions += 1;
saveData(data);
}

/* ===== Timer ===== */

function updateDisplay(){
let m=Math.floor(currentTime/60);
let s=currentTime%60;
m=m<10?"0"+m:m;
s=s<10?"0"+s:s;
document.getElementById("timer").textContent=m+":"+s;
}

function startTimer(){
if(timerInterval) return;

ensureMonthExists();
lockedPriority = document.getElementById("prioritySelect").value;
document.getElementById("startBtn").classList.add("glow");

timerInterval=setInterval(()=>{

if(currentTime>0){
currentTime--;
if(!isBreak){ addSecond(); }
updateDisplay();
}else{

/* 🔔 تشغيل الصوت حسب المرحلة */
if(!isBreak){
focusSound.currentTime = 0;
focusSound.play();
}else{
breakSound.currentTime = 0;
breakSound.play();
}

/* 📳 اهتزاز لو مدعوم */
if(navigator.vibrate){
navigator.vibrate([200,100,200]);
}

if(!isBreak){ addSession(); }

isBreak=!isBreak;
breakTime=document.getElementById("breakSelect").value*60;
currentTime=isBreak?breakTime:focusTime;

document.getElementById("modeText").textContent=
isBreak?"وضع الاستراحة 🌿":"وضع التركيز 🍅";

document.getElementById("card").classList.toggle("break");
updateDisplay();
}

},1000);
}

function pauseTimer(){
clearInterval(timerInterval);
timerInterval=null;
document.getElementById("startBtn").classList.remove("glow");
}

function stopTimer(){
resetTimer();
}

function resetTimer(){
clearInterval(timerInterval);
timerInterval=null;
currentTime = focusTime;
isBreak = false;
lockedPriority = null;
document.getElementById("modeText").textContent="وضع التركيز 🍅";
document.getElementById("card").classList.remove("break");
document.getElementById("startBtn").classList.remove("glow");
updateDisplay();
}

document.getElementById("prioritySelect").addEventListener("change", resetTimer);
document.getElementById("startBtn").addEventListener("click", startTimer);
document.getElementById("pauseBtn").addEventListener("click", pauseTimer);
document.getElementById("stopBtn").addEventListener("click", stopTimer);

/* ===== باقي الإحصائيات كما هي ===== */
/* (لم يتم تغييرها نهائيًا) */

updateDisplay();
ensureMonthExists();
</script>
</body>
</html>

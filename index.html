<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&display=swap" rel="stylesheet">
<style>
html,body{
margin:0;
padding:0;
height:100%;
display:flex;
justify-content:center;
align-items:center;
background:transparent;
font-family:'Cairo',sans-serif;
}
.card{
width:620px;
height:680px;
border-radius:26px;
overflow:hidden;
position:relative;
box-shadow:0 20px 45px rgba(0,0,0,0.2);
color:white;
}
.card::before{
content:"";
position:absolute;
inset:0;
background:url("https://i.imgur.com/WG3oMtB.jpg") center/cover no-repeat;
z-index:0;
}
.card::after{
content:"";
position:absolute;
inset:0;
background:rgba(224,138,179,0.35);
z-index:0;
transition:background .4s ease;
}
.card.break::after{
background:rgba(120,200,170,0.35);
}
.content{
position:relative;
z-index:1;
padding:60px 30px;
text-align:center;
}
.timer{
font-size:90px;
margin:30px 0;
}
.controls{
margin:25px 0;
display:flex;
justify-content:center;
gap:18px;
}
.controls button{
width:64px;
height:64px;
border-radius:50%;
border:none;
font-size:22px;
cursor:pointer;
background:rgba(255,255,255,0.25);
backdrop-filter:blur(6px);
color:white;
}
.glow{
box-shadow:0 0 25px rgba(255,255,255,.9),
0 0 50px rgba(255,150,200,.9);
}
#statsOverlay{
position:fixed;
inset:0;
background:rgba(0,0,0,0.4);
display:none;
justify-content:center;
align-items:center;
z-index:999;
}
.statsBox{
width:420px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(15px);
border-radius:20px;
padding:30px;
color:white;
text-align:center;
}
</style>
</head>
<body>

<div class="card" id="card">
<div class="content">
<div id="modeText">وضع التركيز 🍅</div>
<div class="timer" id="timer">30:00</div>

<div class="controls">
<button id="startBtn">▶</button>
<button id="pauseBtn">⏸</button>
<button id="stopBtn">⏹</button>
<button id="statsBtn">📊</button>
</div>
</div>
</div>

<div id="statsOverlay">
<div class="statsBox">
<h3>📊 الإحصائيات</h3>
<div id="statsContent"></div>
<button onclick="closeStats()">إغلاق</button>
</div>
</div>

<script>
let focusTime = 30*60;
let currentTime = focusTime;
let timerInterval = null;
let isBreak = false;

/* ===== صوت ===== */
const alarm = new Audio("https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg");
alarm.volume = 0.5;

/* ===== عرض الوقت ===== */
function updateDisplay(){
let m=Math.floor(currentTime/60);
let s=currentTime%60;
document.getElementById("timer").textContent=
(m<10?"0"+m:m)+":"+(s<10?"0"+s:s);
}

/* ===== تشغيل ===== */
function startTimer(){
if(timerInterval) return;

document.getElementById("startBtn").classList.add("glow");

timerInterval=setInterval(()=>{
if(currentTime>0){
currentTime--;
updateDisplay();
}else{

alarm.currentTime=0;
alarm.play();

isBreak=!isBreak;
currentTime = isBreak ? 5*60 : focusTime;

document.getElementById("modeText").textContent=
isBreak?"وضع الاستراحة 🌿":"وضع التركيز 🍅";

document.getElementById("card").classList.toggle("break");
updateDisplay();
}
},1000);
}

/* ===== إيقاف مؤقت ===== */
function pauseTimer(){
clearInterval(timerInterval);
timerInterval=null;
document.getElementById("startBtn").classList.remove("glow");
}

/* ===== إيقاف كامل ===== */
function stopTimer(){
clearInterval(timerInterval);
timerInterval=null;
currentTime=focusTime;
isBreak=false;
document.getElementById("card").classList.remove("break");
document.getElementById("modeText").textContent="وضع التركيز 🍅";
updateDisplay();
}

/* ===== إحصائيات ===== */
function openStats(){
document.getElementById("statsOverlay").style.display="flex";
document.getElementById("statsContent").innerHTML=
"نسخة مستقرة — كل الأزرار تعمل.";
}

function closeStats(){
document.getElementById("statsOverlay").style.display="none";
}

/* ===== ربط الأزرار ===== */
document.getElementById("startBtn").addEventListener("click", startTimer);
document.getElementById("pauseBtn").addEventListener("click", pauseTimer);
document.getElementById("stopBtn").addEventListener("click", stopTimer);
document.getElementById("statsBtn").addEventListener("click", openStats);

updateDisplay();
</script>

</body>
</html>
